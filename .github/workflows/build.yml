name: Build and test Java backend

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: mkdir -p out && javac -Xlint:unchecked -d out src/*.java
      - name: Run Test Suite
        run: java -cp out TestRunner
